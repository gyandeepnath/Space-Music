# Opens the published site in a real browser, with the live feeds, and
# commits what it found (summary and screenshots) to reports/live/.
name: Check the live site

on:
  workflow_dispatch:
  push:
    paths:
      - tools/live-check.mjs
      - .github/workflows/live-check.yml

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - run: node tools/live-check.mjs
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live
          git diff --cached --quiet && exit 0
          git commit -q -m "Update live site check [skip ci]"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
